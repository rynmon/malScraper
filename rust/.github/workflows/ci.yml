name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Run tests
        run: |
          cd rust
          cargo test --verbose

      - name: Check formatting
        run: |
          cd rust
          cargo fmt -- --check

      - name: Lint
        run: |
          cd rust
          cargo clippy -- -D warnings

      - name: Build
        run: |
          cd rust
          cargo build --release --verbose

