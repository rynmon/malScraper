name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Run tests
        working-directory: rust
        run: cargo test --verbose

      - name: Check formatting
        working-directory: rust
        run: cargo fmt -- --check

      - name: Lint
        working-directory: rust
        run: cargo clippy -- -D warnings

      - name: Build
        working-directory: rust
        run: cargo build --release --verbose

  build-macos-arm:
    name: Build macOS ARM (aarch64-apple-darwin)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (aarch64-apple-darwin)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: aarch64-apple-darwin

      - name: Build aarch64-apple-darwin
        working-directory: rust
        run: cargo build --release --target aarch64-apple-darwin --verbose

      - name: Verify binary architecture
        working-directory: rust
        run: |
          file target/aarch64-apple-darwin/release/malscraper
          file target/aarch64-apple-darwin/release/malscraper | grep -q "arm64"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: malscraper-aarch64-apple-darwin
          path: rust/target/aarch64-apple-darwin/release/malscraper
          if-no-files-found: error
