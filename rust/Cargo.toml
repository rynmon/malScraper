[package]
name = "malscraper"
version = "2.0.4"
edition = "2021"
authors = ["Ryan Monaghan"]
description = "Cross-platform tool to scrape malware domains, IOCs, and C2 IPs from various feeds"
license = "MIT"
repository = "https://github.com/rynmon/malScraper"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
clap = { version = "4.4", features = ["derive"] }
indicatif = "0.17"
colored = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
zip = "0.6"
sha2 = "0.10"
hex = "0.4"
dirs = "5.0"
anyhow = "1.0"
thiserror = "1.0"
futures = "0.3"
once_cell = "1.19"
dialoguer = "0.11"
console = "0.15"
rustyline = "14.0"
semver = "1.0"
rand = "0.8"
ctrlc = "3.4"
crossterm = "0.27"
chrono = "0.4"
uuid = { version = "1.6", features = ["v4", "serde"] }
trust-dns-resolver = "0.23"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["wincon", "libloaderapi", "processthreadsapi", "consoleapi", "processenv", "fileapi", "winnt", "winbase"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[target.'cfg(windows)'.build-dependencies]
embed-resource = "2.0"

