<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)"/>
  
  <!-- Simple magnifying glass -->
  <circle cx="220" cy="220" r="80" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
  <line x1="280" y1="280" x2="340" y2="340" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
  
  <!-- Simple network/web lines inside the glass -->
  <line x1="180" y1="200" x2="260" y2="200" stroke="#ffffff" stroke-width="8" opacity="0.7"/>
  <line x1="200" y1="240" x2="240" y2="240" stroke="#ffffff" stroke-width="8" opacity="0.7"/>
</svg>
